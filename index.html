<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Générateur de CV &amp; Lettre de Motivation</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header no-print">
  <h1>Générateur de CV &amp; Lettre de Motivation</h1>
  <p>Remplissez le formulaire une fois, obtenez un CV et une lettre de motivation prêts à envoyer.</p>
</header>

<main>

  <section id="form-view">
    <form id="cv-form" novalidate>

      <fieldset>
        <legend>Informations personnelles</legend>
        <div class="grid">
          <label>Prénom
            <input type="text" name="prenom" required>
          </label>
          <label>Nom
            <input type="text" name="nom" required>
          </label>
          <label>Email
            <input type="email" name="email" required>
          </label>
          <label>Téléphone
            <input type="tel" name="telephone">
          </label>
          <label>Ville
            <input type="text" name="ville">
          </label>
          <label>Poste visé
            <input type="text" name="poste" placeholder="Ex : Développeur Full-Stack" required>
          </label>
        </div>
        <label>Profil / accroche professionnelle
          <textarea name="profil" rows="3" placeholder="2-3 phrases résumant votre profil et vos objectifs"></textarea>
        </label>
      </fieldset>

      <fieldset>
        <legend>Formation</legend>
        <div id="formations-list"></div>
        <button type="button" class="btn-add" data-add="formation">+ Ajouter une formation</button>
      </fieldset>

      <fieldset>
        <legend>Expérience professionnelle</legend>
        <div id="experiences-list"></div>
        <button type="button" class="btn-add" data-add="experience">+ Ajouter une expérience</button>
      </fieldset>

      <fieldset>
        <legend>Compétences</legend>
        <label>Compétences techniques (séparées par des virgules)
          <input type="text" name="competences" placeholder="Ex : JavaScript, React, Node.js, SQL">
        </label>
        <label>Centres d'intérêt (séparés par des virgules, optionnel)
          <input type="text" name="interets">
        </label>
      </fieldset>

      <fieldset>
        <legend>Langues</legend>
        <div id="langues-list"></div>
        <button type="button" class="btn-add" data-add="langue">+ Ajouter une langue</button>
      </fieldset>

      <fieldset>
        <legend>Lettre de motivation</legend>
        <div class="grid">
          <label>Entreprise destinataire (optionnel)
            <input type="text" name="lettreEntreprise" placeholder="Ex : Acme Corp">
          </label>
          <label>Civilité du destinataire
            <select name="lettreCivilite">
              <option value="Madame, Monsieur">Madame, Monsieur</option>
              <option value="Madame">Madame</option>
              <option value="Monsieur">Monsieur</option>
            </select>
          </label>
        </div>
        <label>Points forts / motivations à mettre en avant
          <textarea name="lettrePointsForts" rows="4" placeholder="Ce qui vous distingue pour ce poste, vos motivations"></textarea>
        </label>
      </fieldset>

      <div class="form-actions">
        <button type="submit" class="btn-primary">Générer mon CV et ma lettre</button>
        <button type="button" id="btn-reset" class="btn-secondary">Réinitialiser</button>
      </div>
    </form>
  </section>

  <section id="result-view" hidden>
    <div class="toolbar no-print">
      <button type="button" id="btn-edit" class="btn-secondary">← Modifier mes informations</button>
    </div>

    <div class="documents">
      <div id="cv-wrapper" class="doc-wrapper">
        <div class="toolbar no-print">
          <button type="button" class="btn-primary" data-print="cv">Télécharger le CV en PDF</button>
        </div>
        <article id="cv-doc" class="document"></article>
      </div>

      <div id="letter-wrapper" class="doc-wrapper">
        <div class="toolbar no-print">
          <button type="button" class="btn-primary" data-print="letter">Télécharger la lettre en PDF</button>
        </div>
        <article id="letter-doc" class="document"></article>
      </div>
    </div>
  </section>

</main>

<template id="formation-row-template">
  <div class="repeat-row" data-row="formation">
    <div class="grid">
      <label>Diplôme
        <input type="text" data-field="diplome" required>
      </label>
      <label>École / Établissement
        <input type="text" data-field="ecole">
      </label>
      <label>Année de début
        <input type="text" data-field="debut" placeholder="Ex : 2021">
      </label>
      <label>Année de fin
        <input type="text" data-field="fin" placeholder="Ex : 2024 ou En cours">
      </label>
    </div>
    <button type="button" class="btn-remove" data-remove>Supprimer</button>
  </div>
</template>

<template id="experience-row-template">
  <div class="repeat-row" data-row="experience">
    <div class="grid">
      <label>Poste
        <input type="text" data-field="poste" required>
      </label>
      <label>Entreprise
        <input type="text" data-field="entreprise">
      </label>
      <label>Période
        <input type="text" data-field="periode" placeholder="Ex : Jan 2023 - Aujourd'hui">
      </label>
    </div>
    <label>Missions principales (une par ligne)
      <textarea data-field="description" rows="3"></textarea>
    </label>
    <button type="button" class="btn-remove" data-remove>Supprimer</button>
  </div>
</template>

<template id="langue-row-template">
  <div class="repeat-row" data-row="langue">
    <div class="grid">
      <label>Langue
        <input type="text" data-field="langue">
      </label>
      <label>Niveau
        <select data-field="niveau">
          <option>Notions</option>
          <option>Intermédiaire</option>
          <option selected>Courant</option>
          <option>Bilingue</option>
          <option>Langue maternelle</option>
        </select>
      </label>
    </div>
    <button type="button" class="btn-remove" data-remove>Supprimer</button>
  </div>
</template>

<script src="js/app.js"></script>
</body>
</html>
